[project]
name = "mlops-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.5.3",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.10.8",
    "mlflow>=3.15.1",
    "pandas>=2.3.3",
    "requests>=2.33.1",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
train = "mlops_project.train:train"
predict = "mlops_project.predict:main"
predict-rest = "mlops_project.predict_via_rest:main"
